apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: orders-to-products-delay
  namespace: microservices-project
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - microservices-project
    labelSelectors:
      app: orders-service
  target:
    mode: all
    selector:
      namespaces:
        - microservices-project
      labelSelectors:
        app: products-service
  delay:
    latency: "500ms"
    correlation: "25"
    jitter: "100ms"
  duration: "60s"
  scheduler:
    cron: "@every 5m"

